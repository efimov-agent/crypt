version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    volumes:
      - ./src/CryptApp.Web/App_Data:/app/App_Data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - crypt-network

  # Optional PostgreSQL service - uncomment to enable
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: cryptuser
  #     POSTGRES_PASSWORD: cryptpassword
  #     POSTGRES_DB: cryptdb
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - crypt-network
  #   ports:
  #     - "5432:5432"

networks:
  crypt-network:
    driver: bridge

# Uncomment to enable PostgreSQL volume
# volumes:
#   postgres-data: